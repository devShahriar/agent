apiVersion: apps/v1
kind: Deployment
metadata:
  name: abproxy-api
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: abproxy-api
  template:
    metadata:
      labels:
        app: abproxy-api
    spec:
      containers:
        - name: abproxy-api
          image: devshahriar/abproxy-api:v1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch:9200"
---
apiVersion: v1
kind: Service
metadata:
  name: abproxy-api
  namespace: monitoring
spec:
  selector:
    app: abproxy-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
